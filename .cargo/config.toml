[build]
target = "thumbv7em-none-eabi"

[target.thumbv7em-none-eabi]
rustflags = [
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]
runner = [
    "probe-rs", "run",
    "--chip", "nRF52832_xxAA",
    "--log-format", "{t} {L} {s}",
]

[env]
DEFMT_LOG = "info"
DEFMT_RTT_BUFFER_SIZE = "1024"