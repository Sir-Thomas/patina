[workspace]
members = ["firmware", "simulator", "pinetime-bsp"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "A reliable, extensible Watch OS for the PineTime written in Rust"
repository = "https://github.com/Sir-Thomas/patina"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
defmt = "1.2.0"
embassy-embedded-hal = "0.6.0"
embassy-nrf = { version = "0.11.0", features = [
    "gpiote",
    "nfc-pins-as-gpio",
    "nrf52832",
    "time-driver-rtc1",
    "time",
] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embedded-graphics = { version = "0.8.2", features = ["defmt"] }
embedded-hal-async = { version = "1.0.0", features = ["defmt-03"] }
embedded-layout = "0.4.2"
lcd-async = "0.1.3"
nrf-sdc = { version = "0.4.0", default-features = false, features = ["defmt", "nrf52832", "peripheral"] }
spi-memory-async = "0.2.0"
static_cell = "2.1.1"

[patch.crates-io]
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "9cf87fa7883b89b2d4dc7cd94864da7927bd858c" }
trouble-host = { git = "https://github.com/embassy-rs/trouble.git", rev = "43a14413508eb63a114df672f9a93dab624b717d" }

[profile.release]
debug = 2
codegen-units = 1
lto = "fat"
opt-level = 'z'
