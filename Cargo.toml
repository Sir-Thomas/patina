[workspace]
members = ["firmware", "simulator"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "A reliable, extensible Watch OS for the PineTime written in Rust"
repository = "https://github.com/Sir-Thomas/patina"
license = "MIT OR Apache-2.0"
publish = false

[patch.crates-io]
#embassy-sync = { git = "https://github.com/embassy-rs/embassy.git", rev = "ac1d8719b64cba62a132d12ba1cba107ce88afa8" }
#lcd-async = { git = "https://github.com/okhsunrog/lcd-async.git", rev = "50efe0a30a4c68a1502049556b2ffb27c13b9539" }
nrf-sdc = { git = "https://github.com/alexmoon/nrf-sdc.git", rev = "9cf87fa7883b89b2d4dc7cd94864da7927bd858c" }
trouble-host = { git = "https://github.com/embassy-rs/trouble.git", rev = "43a14413508eb63a114df672f9a93dab624b717d" }

[profile.release]
debug = 2
codegen-units = 1
lto = "fat"
opt-level = 'z'
