[package]
name = "patina-firmware"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
buoyant = "0.8.0-alpha.0"
cortex-m = { version = "0.7.10", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = { workspace = true }
defmt-rtt = "1.3.1"
eg-seven-segment = "0.2.0"
embassy-embedded-hal = { workspace = true, features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "defmt", "executor-interrupt", "executor-thread"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-nrf = { workspace = true, features = ["defmt"] }
embassy-sync = { workspace = true, features = ["defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embedded-graphics = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-icon = { version = "0.0.1", features = ["32px", "48px"] }
embedded-layout = { workspace = true }
embedded-text = "0.7.3"
heapless = { version = "0.9.3", features = ["defmt"] }
lcd-async = { workspace = true }
nrf-dfu-target = { version = "0.3.2", features = ["defmt"] }
nrf-sdc = { workspace = true }
panic-probe = { version = "1.0.0", features = ["defmt"] }
pinetime-bsp = { path = "../pinetime-bsp", features = ["defmt"] }
spi-memory-async = { workspace = true }
static_cell = { workspace = true }
time = { version = "0.3.55", default-features = false }
trouble-host = { version = "0.8.0", default-features = false, features = ["default-packet-pool", "derive", "defmt", "gatt", "peripheral"] }
u8g2-fonts = { version = "0.8.0", features = ["embedded_graphics_textstyle"] }

[features]
baremetal = []
