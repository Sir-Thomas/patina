[package]
name = "patina-firmware"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bt-hci = { version = "0.8.0", default-features = false, features = ["defmt", "embassy-time"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.1.0"
eg-seven-segment = "0.2.0"
embassy-embedded-hal = { version = "0.5.0", features = ["defmt"] }
embassy-executor = { version = "0.9.1", features = ["arch-cortex-m", "defmt", "executor-interrupt", "executor-thread"] }
embassy-futures = { version = "0.1.2", features = ["defmt"] }
embassy-nrf = { version = "0.9.0", features = ["defmt", "gpiote", "nfc-pins-as-gpio", "nrf52832", "time", "time-driver-rtc1"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt", "defmt-timestamp-uptime"] }
embedded-graphics = { version = "0.8.1", features = ["defmt"] }
embedded-hal-async = { version = "1.0.0", features = ["defmt-03"] }
embedded-icon = { version = "0.0.1", features = ["32px", "48px"] }
embedded-layout = "0.4.2"
embedded-text = "0.7.3"
heapless = { version = "0.9.2", features = ["defmt"] }
lcd-async = "0.1.1"
nrf-dfu-target = { version = "0.3.2", features = ["defmt"] }
nrf-sdc = { version = "0.4.0", default-features = false, features = ["defmt", "nrf52832", "peripheral"] }
panic-probe = { version = "1.0.0", features = ["defmt"] }
pinetime-bsp = { path = "../../pinetime-bsp", features = ["defmt"] }
spi-memory-async = "0.2.0"
static_cell = "2.1.1"
time = { version = "0.3.46", default-features = false }
trouble-host = { version = "0.6.0", features = ["defmt", "gatt", "peripheral"] }
u8g2-fonts = { version = "0.7.2", features = ["embedded_graphics_textstyle"] }

[features]
baremetal = []